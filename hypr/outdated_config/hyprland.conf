# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

# Monitors
monitor=DP-2,2560x1440@180,0x0,1
monitor=HDMI-A-1,1920x1080@60,2560x0,1
monitor=HDMI-A-2,1920x1080@60,4480x0,1

# AOC — MAIN / LEFT
workspace = 1, monitor:DP-2
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-2

# DSGR — SECONDARY / MIDDLE
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 10, monitor:HDMI-A-1

# PHILIPS — LEFTOVER / RIGHT
workspace = 11, monitor:HDMI-A-2
workspace = 12, monitor:HDMI-A-2
workspace = 13, monitor:HDMI-A-2
workspace = 14, monitor:HDMI-A-2
workspace = 15, monitor:HDMI-A-2

# Mouse settings
input {
    accel_profile = flat
    sensitivity = 0
}

$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = fuzzel
$browser = firefox
$notifications = swaync-client -t

exec-once = waybar
exec-once = hyprpaper
exec-once = hyprsunset
exec-once = swaync

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = udiskie --tray

exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

input {
    repeat_delay = 200
    repeat_rate = 50
    kb_layout = no
}

cursor {
    no_warps = true
    hide_on_key_press = true
}

animation = workspaces, 1, 5, default, slidefade 20%

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, ESCAPE, killactive,
# bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod, B, exec, $browser
bind = $mainMod, V, togglefloating,
bind = $mainMod, N, exec, swaync-client -t
bind = $mainMod, V, centerwindow,
bind = $mainMod, F, fullscreen
bind = $mainMod, Space, exec, $menu

# window center and resize bind
bind = SUPER SHIFT, V, togglefloating,
bind = SUPER SHIFT, V, resizeactive, exact 1440 900
bind = SUPER SHIFT, V, centerwindow

# toggle gaps
bind = SUPER, G, exec, ~/.config/hypr/scripts/toggle-gaps.sh

# set wallpaper folder and relaunch hyprpaper
bind = SUPER SHIFT, W, exec, .config/hypr/scripts/select-wallpaper-folder.sh

# set audio output
bind = SUPER SHIFT, A, exec, .config/hypr/scripts/select-audio-output.sh

# set temperaute of screen.
bind = SUPER SHIFT, N, exec, sh -c 'choice=$(printf "6500\n4000\n3000\n2500\n2000\n1500\n1000" | fuzzel --dmenu --prompt="Temp"); [ -n "$choice" ] && hyprctl hyprsunset temperature "$choice"'

# alt + hjkl
# bind = ALT, H, exec, wtype -k left
# bind = ALT, J, exec, wtype -k down
# bind = ALT, K, exec, wtype -k up
# bind = ALT, L, exec, wtype -k right
#

# screenshot
#
bind = $mainMod SHIFT, s, exec, grim -g "$(slurp)" - | wl-copy

# opening btop, to check computer stats
bind = SUPER, F1, exec, kitty -e btop

# moving focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT CTRL, h, swapwindow, l
bind = $mainMod SHIFT CTRL, l, swapwindow, r
bind = $mainMod SHIFT CTRL, k, swapwindow, u
bind = $mainMod SHIFT CTRL, j, swapwindow, d

# moving tiled windows
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# floating windows
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

bind = $mainMod CTRL, H, resizeactive, -100 0
bind = $mainMod CTRL, L, resizeactive, 100 0
bind = $mainMod CTRL, K, resizeactive, 0 -100
bind = $mainMod CTRL, J, resizeactive, 0 100

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# volume control
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t

# changing workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT CTRL, 1, exec, ~/.config/hypr/scripts/swap-workspaces.sh 1
bind = $mainMod SHIFT CTRL, 2, exec, ~/.config/hypr/scripts/swap-workspaces.sh 2
bind = $mainMod SHIFT CTRL, 3, exec, ~/.config/hypr/scripts/swap-workspaces.sh 3
bind = $mainMod SHIFT CTRL, 4, exec, ~/.config/hypr/scripts/swap-workspaces.sh 4
bind = $mainMod SHIFT CTRL, 5, exec, ~/.config/hypr/scripts/swap-workspaces.sh 5
bind = $mainMod SHIFT CTRL, 6, exec, ~/.config/hypr/scripts/swap-workspaces.sh 6
bind = $mainMod SHIFT CTRL, 7, exec, ~/.config/hypr/scripts/swap-workspaces.sh 7
bind = $mainMod SHIFT CTRL, 8, exec, ~/.config/hypr/scripts/swap-workspaces.sh 8
bind = $mainMod SHIFT CTRL, 9, exec, ~/.config/hypr/scripts/swap-workspaces.sh 9
bind = $mainMod SHIFT CTRL, 0, exec, ~/.config/hypr/scripts/swap-workspaces.sh 10

bind = $mainMod, Tab, workspace, +1
bind = $mainMod CTRL, Tab, movetoworkspace, +1
bind = $mainMod SHIFT, Tab, workspace, -1
bind = $mainMod SHIFT CTRL, Tab, movetoworkspace, -1

## search for window
bind = $mainMod, W, exec, ~/.config/hypr/scripts/search-window.sh

# copy paste
bind = $mainMod, C, exec, wl-copy "$(wl-paste)"
bind = $mainMod, V, exec, wtype "$(wl-paste)"
bind = $mainMod SHIFT, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy


# graphical

general {
col.active_border = rgba(a78bfaff)
col.inactive_border = rgba(0f0a1aff)
border_size = 3
}
